# A 5-inch racing quad. The point of this spec is that it is NOT the freestyle
# build in quad5.toml: racing trades everything for thrust-to-weight and
# response, so the battery is small, the payload is minimal, and the objective
# is max_speed rather than max_endurance.
#
# Everything is SI (GEOM-02: x forward, y right, z DOWN).

name = "racer5"

[mission]
objective = "max_speed"
min_endurance = 120.0        # two minutes of racing, not eight of cruising
payload_mass = 0.0

# -- electronics -------------------------------------------------------------

[[bodies]]
name = "stack"               # FC + 4-in-1 ESC
type = "body"
mass = 0.028
position = [0.0, 0.0, 0.0]
shape = { kind = "box", lx = 0.030, ly = 0.030, lz = 0.011 }

[[bodies]]
name = "battery"             # 4S 1100 mAh, light for the class
type = "battery"
mass = 0.135
position = [-0.005, 0.0, 0.020]
shape = { kind = "box", lx = 0.068, ly = 0.034, lz = 0.026 }
capacity_ah = 1.1
nominal_voltage = 14.8
max_c_rate = 120.0

[[bodies]]
name = "camera"              # racing cam, tilted hard for speed
type = "camera"
mass = 0.009
position = [0.048, 0.0, -0.006]
rotation_deg = [0.0, 40.0, 0.0]
shape = { kind = "box", lx = 0.016, ly = 0.016, lz = 0.016 }
view_direction = [1.0, 0.0, 0.0]
horizontal_fov_deg = 150.0

[[bodies]]
name = "vtx"
type = "body"
mass = 0.010
position = [-0.045, 0.0, -0.004]
shape = { kind = "box", lx = 0.022, ly = 0.018, lz = 0.006 }

# -- structure ---------------------------------------------------------------

[[frame]]
name = "chassis"
type = "body"
mass = 0.085
position = [0.0, 0.0, 0.002]
shape = { kind = "box", lx = 0.150, ly = 0.070, lz = 0.024 }

# -- propulsion --------------------------------------------------------------
# 2207 2400Kv on 4S: a race motor, higher Kv and more thrust than the
# freestyle build. ~1.25 kgf per motor on a 5x4.3x3.

[[thrusters]]
name = "front_right"
type = "rotor"
mass = 0.031
position = [0.088, 0.088, -0.042]
radius = 0.0635
pitch = 0.109
blades = 3
spin = "cw"
static_thrust_n = 12.3

[[thrusters]]
name = "rear_right"
type = "rotor"
mass = 0.031
position = [-0.088, 0.088, -0.042]
radius = 0.0635
pitch = 0.109
blades = 3
spin = "ccw"
static_thrust_n = 12.3

[[thrusters]]
name = "rear_left"
type = "rotor"
mass = 0.031
position = [-0.088, -0.088, -0.042]
radius = 0.0635
pitch = 0.109
blades = 3
spin = "cw"
static_thrust_n = 12.3

[[thrusters]]
name = "front_left"
type = "rotor"
mass = 0.031
position = [0.088, -0.088, -0.042]
radius = 0.0635
pitch = 0.109
blades = 3
spin = "ccw"
static_thrust_n = 12.3

# -- constraints -------------------------------------------------------------

[[constraints]]
type = "cg_box"              # racing wants the CG tight and central
lower = [-0.010, -0.008, -0.030]
upper = [0.010, 0.008, 0.030]

[[constraints]]
type = "view_cone"
camera = "camera"
half_angle_deg = 22.0
obstructed_by = ["front_right", "front_left"]

[[constraints]]
type = "min_distance"
a = "battery"
b = "vtx"
distance = 0.030
