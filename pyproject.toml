[project]
name = "camber"
dynamic = ["version"]
description = "Drone design optimiser: give it a mission, and it lays out, sizes, grows and flies the airframe"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Abhijit" }]
keywords = ["drone", "multirotor", "uav", "design-optimisation", "nsga-ii",
            "topology-optimisation", "bemt", "openfoam", "mujoco"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/Abhijit-s999/camber"
Issues = "https://github.com/Abhijit-s999/camber/issues"
Decisions = "https://github.com/Abhijit-s999/camber/blob/main/docs/DECISIONS.md"

# The bench is DEVELOPMENT TOOLING. It is deliberately an optional extra so that
# a plain `pip install camber` cannot pull a network client into the product.
# See docs/DECISIONS.md AI-04.
[project.optional-dependencies]
bench = ["httpx>=0.27", "mcp>=1.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "mcp>=1.2", "camber[app]"]
# The blade-element propeller tier (PHYS-01..05): NeuralFoil tabulates the
# blade section, through AeroSandbox's airfoil geometry. Needed by `validate`,
# `endurance` and `optimise --prop`; the layout search runs without it.
physics = ["scipy>=1.11", "aerosandbox>=4.2", "neuralfoil>=0.3"]
cad = ["build123d>=0.11"]
# Topology optimisation (GEN-02). Kept optional for the same reason as the
# bench: `camber inspect` and `camber optimise` must still run with numpy and
# nothing else (AI-07), and `tests/test_topology.py` asserts the core imports pull
# none of these. pyamg is what makes fine grids affordable -- see GEN-12 -- and
# the solve falls back to a direct factorisation without it. manifold3d is the
# mesh boolean that drills the bolt holes (GEN-11 needs one, and trimesh has
# none of its own); without it trimesh looks for a `blender` on PATH (PKG-04).
generate = ["scipy>=1.11", "scikit-image>=0.22", "trimesh>=4.0", "pyamg>=5.0",
            "fast-simplification>=0.1", "manifold3d>=3.0"]
# Flying the designed vehicle in MuJoCo (camber.sim). ROS 2 lives in ros/ and
# brings its own environment; see ros/pixi.toml.
sim = ["mujoco>=3.2", "trimesh>=4.0"]
# The desktop app: everything above. Without Qt WebEngine it opens in the
# browser; on Arch it comes from pacman (packaging/arch/install.sh), elsewhere
# from the `qt` extra.
app = ["camber[physics,generate,sim,cad]"]
qt = ["PyQt6>=6.6", "PyQt6-WebEngine>=6.6"]

# Only `camber`. The bench runs as `python -m bench.cli` from a checkout: a
# `bench` launcher in the wheel would point at a module the wheel leaves out.
[project.scripts]
camber = "camber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "camber/__init__.py"

[tool.hatch.build.targets.wheel]
# bench/ is NOT packaged. It never ships.
packages = ["camber"]

# What the app reads at run time from outside the package in a checkout. The
# wheel carries a copy inside it, where camber/paths.py looks once installed
# (PKG-02).
[tool.hatch.build.targets.wheel.force-include]
"data/interference.json" = "camber/data/interference.json"
"data/validation_summary.json" = "camber/data/validation_summary.json"
"examples/racer5.toml" = "camber/examples/racer5.toml"
"examples/quad5.toml" = "camber/examples/quad5.toml"
"examples/pilots/figure_eight.py" = "camber/examples/pilots/figure_eight.py"
"examples/pilots/flip.py" = "camber/examples/pilots/flip.py"
"scripts/foam-env.sh" = "camber/scripts/foam-env.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
