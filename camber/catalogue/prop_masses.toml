# Published propeller weights, for the propellers Camber can choose (CAT-04).
# Each row is one maker's or seller's published figure, with the page and the
# text quoted (LIC-03). APC publishes ounces; those are converted at 28.3495 g.
# A propeller with no row here gets an estimate from a power law through these,
# and says so wherever it is shown.
#
# Doubts recorded per row in `notes`: whether APC's figure includes the adapter
# rings it ships with, nominal per-diameter weights from Master Airscrew, and
# disagreeing sellers for the smallest GWS propellers.

[[prop]]
uiuc_key = "apcff_4.2x4"
as_published = "APC 4.2x4"
mass_g = 3.1
url = "https://www.apcprop.com/product/4-2x4/"
quote = """Product Code: LP04240
4.2x4
[...]
Product Weight
0.11 oz."""
notes = "Published in oz; converted 0.11 oz x 28.3495 = 3.12 g (rounded to 0.1 g). APC gives only 2 decimals of oz, so resolution is about +/-0.14 g. APC lists it under \"049 Free Flight\". Page says the prop \"Includes one set of rings from LPAR18SF\"; it does not say whether Product Weight includes those adapter rings."

