# The motors Camber chooses from (CAT-01). Compiled by Camber from each maker's
# own published specification of its own product, one row per motor and Kv,
# with the page it came from and the spec text quoted (LIC-03, AI-06).
#
# A row needs everything the physics and the limits use: Kv, winding resistance,
# no-load current, mass, the maker's current rating and cell range. A motor
# whose page lacks one of those is left out, not completed by estimate.
#
# resistance_mohm      winding (internal) resistance as published, milliohm
# no_load_current_a    idle current, at no_load_voltage_v where the page says
# max_current_a        the maker's peak or max current; max_current_duration_s
#                      says for how long when the page does
# cells_min/max        the rated LiPo cell range; cells_min is left out where
#                      the maker states only a maximum
# props_in             recommended propeller diameters, inches, where published
#
# `tests/test_components.py` fails if a number here is not in its row's quote.

