# PHYS-09's held-out set: makers' own thrust-stand rows for their motors,
# on propellers the UIUC tunnel also measured. Each row cites its page and
# quotes the table row (LIC-03). Nothing in Camber is fitted to these.
#
# Voltages are the round pack values the makers print, not measured terminal
# volts, and no source prints throttle per row, so the rows are compared at
# their measured rpm (see tests/test_motor_validation.py).
#
# `full_throttle = true` marks the Cobra and Scorpion prop charts: one point
# per propeller, at full throttle from a LiPo, as Cobra's chart note puts it:
# "The test voltages used are based on a properly sized Li-Po battery for the
# current draw of the motor being tested. If you are using a larger than normal
# capacity battery ... your actual voltages will be higher than those shown in
# this chart, and this will result in higer current draw for each prop used."
# SunnySky's tables are thrust steps at part throttle, up to a last row.
#
# Left out before any comparison: SunnySky X2212 980Kv on the 9x4.7 at 11.1 V,
# whose top row (13.2 A, 840 g, 8730 rpm) has a lower rpm than the row before
# it, flagged by the collector as a probable typo on the page.
#
# The Cobra motors publish no LiPo cell range, so they cannot be choices in
# the catalogue; their datasheet numbers are here, for validation only.

